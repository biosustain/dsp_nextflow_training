repository_type: pipeline

nf_core_version: 4.2.1

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-minirnaseq_logo_light.png
    - docs/images/nf-core-minirnaseq_logo_light.png
    - docs/images/nf-core-minirnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-minirnaseq_logo_light.png
    - docs/images/nf-core-minirnaseq_logo_light.png
    - docs/images/nf-core-minirnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: dsp
  name: minirnaseq
  description: A mini RNA-seq pipeline built in the DSP Nextflow course
  author: DSP course
  version: 1.0.0dev
  force: true
  outdir: .
  is_nfcore: false
